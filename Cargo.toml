[workspace]
resolver = "2"
members = [
    "adac",
    "adac-cli",
    "adac-crypto",
    "adac-crypto-aws_lc",
    "adac-crypto-pkcs11",
    "adac-crypto-rust",
    "adac-cryptoki",
    "adac-tests",
]

[workspace.package]
authors = ["Mathias Brossard <mathias.brossard@arm.com>"]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
base16ct = "1.0"
base64 = "0.22"
cryptoki = "0.12"
der = { version = "0.8", features = ["alloc"] }
digest = "0.11"
ecdsa = { version = "0.17", features = ["pkcs8"] }
ed25519 = { version = "3.0", features = ["alloc", "pkcs8"] }
ed25519-dalek = { version = "3.0", features = ["digest", "pkcs8"] }
ed448 = { version = "0.5.0", features = ["alloc", "pkcs8"] }
ed448-goldilocks-plus = { version = "0.17", features = ["signing", "pkcs8"] }
elliptic-curve = { version = "0.14", features = ["sec1", "pem", "pkcs8"] }
ml-dsa = { version = "0.1.1", features = ["pkcs8"] }
p256 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
p521 = { version = "0.14", features = ["ecdsa", "pem", "pkcs8"] }
pem = "3.0"
pkcs8 = { version = "0.11", features = ["pem"] }
rand = "0.10"
rsa = { version = "0.10.0-rc.18", features = ["sha2"] }
sec1 = { version = "0.8", features = ["der", "pem"] }
sha2 = "0.11"
shake = "0.1"
signature = "3.0"
sm2 = { version = "0.14.0-rc.15", features = ["arithmetic", "dsa", "pkcs8"] }
sm3 = "0.5"
spki = { version = "0.8", features = ["alloc", "fingerprint", "pem", "std"] }
zeroize = "1.9"
